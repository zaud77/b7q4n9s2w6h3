name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:worker
      - run: pnpm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply and verify production data migration
        run: |
          for attempt in {1..10}; do
            response=$(curl --silent --show-error --fail https://gki.zaomin.dpdns.org/health) || true
            if jq -e '.ok == true
              and .dataMigration == "migration:explicit-workflow-binding-v2"
              and .quotaMigration == "migration:successful-build-quota-v1"
              and .chatHistoryMigration == "migration:private-chat-clear-v1"
              and .buildPreferencesMigration == "migration:user-build-preferences-v1"
              and .commandMenus == "commands:scoped-menus-v4"' <<<"$response"; then
              exit 0
            fi
            echo "Waiting for the new Worker version (attempt $attempt/10)"
            sleep 3
          done
          echo "$response"
          exit 1
