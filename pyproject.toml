[project]
name = "kernel-build-bot"
version = "0.1.0"
description = "Telegram-gated GitHub Actions kernel build dispatcher"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "python-telegram-bot==22.8",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
kernel-build-bot = "kernel_build_bot.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_build_bot"]

